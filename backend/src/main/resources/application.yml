spring:
  application:
    name: ai-translator
  profiles:
    default: mock
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/ai_translator}
    username: ${DB_USER:ai_translator}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  main:
    banner-mode: off
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:${PORT:8090}}
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  verification:
    enabled: ${VERIFICATION_ENABLED:true}
    budget-ms: ${VERIFICATION_BUDGET_MS:30000}
  context:
    max-messages: ${CONTEXT_MAX_MESSAGES:10}
    ttl-seconds: ${CONTEXT_TTL_SECONDS:600}
  translation:
    partner-language: ${TRANSLATION_PARTNER_LANGUAGE:TH}
  mode: live
  line:
    secret: ${LINE_CHANNEL_SECRET:}
    token: ${LINE_CHANNEL_ACCESS_TOKEN:}
    bot-user-id: ${LINE_BOT_USER_ID:}
    push-enabled: ${LINE_PUSH_ENABLED:false}
  ai:
    provider: ${AI_PROVIDER:external}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:15}
